<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspección post-sismo · San José, Caldas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6b45">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#ffffff; --field:#f1f4f2; --ink:#1b2420; --muted:#5a6660; --line:#c8d0cb;
  --brand:#1f6b45; --brand-ink:#ffffff; --warn:#b3261e;
  --verde:#2e8b57; --amarillo:#e3b400; --naranja:#e07b1f; --rojo:#c62828;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#16201b;--field:#202c26;--ink:#e6ece8;--muted:#9fb0a7;--line:#34443c;--brand:#4fae7c;--brand-ink:#08130d;--warn:#ff8a80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:0 14px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--brand)}
header.top img{height:44px;border-radius:4px;background:#fff}
header.top h1{font-size:1.05rem;margin:0;line-height:1.2}
header.top small{color:var(--muted);display:block;font-weight:400}
.btn{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:10px 14px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.dan{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chips input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{margin:16px 0;display:grid;gap:8px}
.item{border:1px solid var(--line);border-left:8px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.item b{font-size:1.05rem}
.item .meta{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted);padding:24px 0}
.nav{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line)}
.nav a{flex:none;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
section.s{padding:14px 0 6px;border-bottom:1px solid var(--line);scroll-margin-top:52px}
section.s>h2{font-size:1.05rem;margin:0 0 10px;color:var(--brand)}
h3{font-size:.95rem;margin:14px 0 6px}
.fld{display:grid;gap:4px;margin:8px 0}
.lbl{font-size:.88rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 10px;font-size:.92rem;user-select:none}
.chips input:checked+label{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.el{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.el>b{display:block;margin-bottom:6px}
.pct{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct label{font-size:.78rem;color:var(--muted);display:grid;gap:2px}
.sum{font-size:.85rem;margin-top:6px}
.sum.bad{color:var(--warn);font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0}
.hidden{display:none!important}
.gps{display:flex;gap:8px;align-items:end}
canvas#sk{width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fotos figure{margin:0;border:1px solid var(--line);border-radius:6px;padding:4px;display:grid;gap:4px}
.fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hab{flex:1;border-radius:8px;padding:8px 12px;font-weight:700;background:var(--field);color:var(--ink);border:1px solid var(--line);min-height:44px;display:flex;flex-direction:column;justify-content:center}
.hab small{font-weight:400;font-size:.78rem}
.h-Verde{background:var(--verde);color:#fff;border-color:var(--verde)}
.h-Amarillo{background:var(--amarillo);color:#1b1b1b;border-color:var(--amarillo)}
.h-Naranja{background:var(--naranja);color:#fff;border-color:var(--naranja)}
.h-Rojo{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.b-Verde{border-left-color:var(--verde)}.b-Amarillo{border-left-color:var(--amarillo)}.b-Naranja{border-left-color:var(--naranja)}.b-Rojo{border-left-color:var(--rojo)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:min(560px,92vw)}
dialog ul{padding-left:18px}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;display:grid;gap:8px}
.sigbox img{max-height:70px;max-width:100%;background:#fff;border-radius:4px}
.ok{color:var(--brand);font-weight:600}
canvas#cfSig{width:100%;aspect-ratio:3/1;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;z-index:20;font-size:.9rem}
#print{display:none}

/* ================= IMPRESIÓN (formato AIS) ================= */
@page{size:letter;margin:9mm}
@media print{
  :root{color-scheme:light;padding:0}
  html,body{background:#fff;color:#000;font:7.6pt/1.25 Arial,Helvetica,sans-serif}
  .app,.bar,dialog,.toast{display:none!important}
  #print{display:block}
  .fx{width:100%;border-collapse:collapse;break-before:page}
  .fx:first-child{break-before:auto}
  .fx>thead td,.fx>tbody>tr>td{padding:0}
  .ph{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;margin-bottom:4px}
  .ph img{height:15mm}
  .ph .t{text-align:center;font-weight:700;font-size:9pt;line-height:1.25}
  .ph .n{border:1px solid #000;padding:2px 6px;min-width:34mm;font-size:7pt}
  .ph .n b{display:block;font-size:10pt}
  .ps{border:1px solid #000;border-radius:7px;padding:4px 6px 5px;margin:0 0 4px;break-inside:avoid}
  .ps>h3{margin:0 0 3px;text-align:center;font-style:italic;font-size:8pt}
  .ps h4{margin:3px 0 2px;font-size:7.6pt;font-style:italic}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .pr{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;margin:1px 0}
  .bx{display:inline-block;width:3.6mm;height:3.2mm;border:1px solid #000;border-radius:45%;text-align:center;line-height:3.2mm;font-weight:700;font-size:7pt;vertical-align:middle;margin-right:2px}
  .vl{display:inline-block;border:1px solid #000;min-width:16mm;padding:0 3px;min-height:3.6mm;vertical-align:middle}
  .k{color:#000;font-weight:700}
  table.g{border-collapse:collapse;width:100%;margin:2px 0}
  table.g td,table.g th{border:1px solid #000;padding:1px 2px;text-align:center;font-size:6.8pt}
  table.g th{background:#d9d9d9;font-weight:700}
  table.g td.l{text-align:left}
  .hb{padding:2px 4px;border:1px solid #000;font-weight:700}
  .cm{width:100%;border-collapse:collapse}
  .cm td{border-bottom:1px solid #000;padding:2px 3px;vertical-align:top}
  .cm td:first-child{width:16mm;border-right:1px solid #000}
  .sk{width:100%;max-height:120mm;object-fit:contain;border:1px solid #000}
  .pf{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
  .pf figure{margin:0;break-inside:avoid}
  .pf img{width:100%;height:75mm;object-fit:contain;border:1px solid #000}
  .pf figcaption{font-size:7pt}
  .foot{display:flex;justify-content:space-between;font-size:6.5pt;margin-top:3px;color:#333}
  .sig{display:inline-block;border-bottom:1px solid #000;min-width:55mm;min-height:5mm;vertical-align:bottom}
  .sig img{height:13mm;display:block}
  .sig small{font-size:6pt}
}
</style>
</head>

/* ---------- Almacenamiento (IndexedDB) ---------- */
let db;
function openDB(){return new Promise((ok,ko)=>{const r=indexedDB.open('inspAIS',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)})}
const tx=(m,fn)=>new Promise((ok,ko)=>{const t=db.transaction('f',m);const s=t.objectStore('f');const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)});
const dbAll=()=>tx('readonly',s=>s.getAll()), dbPut=o=>tx('readwrite',s=>s.put(o)), dbDel=id=>tx('readwrite',s=>s.delete(id));
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let cur=null, saveT=null;
const form=$('#f');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function dialog(html,okTxt){return new Promise(res=>{$('#dlgBody').innerHTML=html;const ok=$('#dlgOk');ok.classList.toggle('hidden',!okTxt);ok.textContent=okTxt||'';const d=$('#dlg');ok.onclick=()=>{d.close();res(true)};$('#dlgNo').onclick=()=>{d.close();res(false)};d.showModal()})}

/* ---------- Render del formulario ---------- */
function build(){
  form.innerHTML=SECS.map(([id,t,fn])=>`<section class="s" id="${id}"><h2>Sección ${t}</h2>${fn()}</section>`).join('');
  $('#nav').innerHTML=SECS.map(([id,t])=>`<a href="#${id}" data-s="${id}">${t.split('.')[0]}. ${t.split('. ')[1].split(' ')[0]}</a>`).join('');
}
function readForm(){
  const o={};
  form.querySelectorAll('input[type=checkbox]').forEach(e=>{o[e.name]=o[e.name]||[]});
  form.querySelectorAll('[name]').forEach(e=>{
    if(e.type==='radio'){if(e.checked)o[e.name]=e.value;else if(!(e.name in o))o[e.name]=''}
    else if(e.type==='checkbox'){if(e.checked)o[e.name].push(e.value)}
    else o[e.name]=e.value;
  });
  return o;
}
function fillForm(d){
  renderCmts(+d.c_n||0);
  form.querySelectorAll('[name]').forEach(e=>{
    const v=d[e.name];
    if(e.type==='radio')e.checked=(v===e.value);
    else if(e.type==='checkbox')e.checked=Array.isArray(v)&&v.includes(e.value);
    else e.value=v??'';
  });
}
function renderCmts(n){
  $('#cmts').innerHTML=Array.from({length:n},(_,i)=>`<div class="grid3" style="grid-template-columns:90px 1fr">${fld('Sección',inp('c_sec_'+i))}${fld('Comentario',`<textarea name="c_txt_${i}"></textarea>`)}</div>`).join('');
  form.querySelector('[name=c_n]').value=n;
}

/* ---------- Lógica derivada ---------- */
function habAuto(d){
  const r=[d.r_global,d.r_geo,d.r_est,d.r_noest];
  if(r.some(x=>!x))return null;
  const alto=r.filter(x=>x==='Alto').length;
  if(r.includes('Muy alto')||alto>2)return 'Rojo';
  if(alto)return 'Naranja';
  if(r.includes('Bajo después de medidas'))return 'Amarillo';
  return 'Verde';
}
function habFinal(d){return (d.habOv||[]).length&&d.habMan?d.habMan:habAuto(d)}
function rng(v,[hi,lo]){if(!(v>0))return -1;return v>hi?0:(v>=lo?1:2)}
function rngLbl([hi,lo]){return [`>${hi}%`,`${lo}-${hi}%`,`<${lo}%`]}
function sum53(d,k){return ['sev','fue','mod','lev','nin'].reduce((a,l)=>a+(parseFloat(d['e53_'+k+'_'+l])||0),0)}
function any53(d,k){return ['sev','fue','mod','lev','nin'].some(l=>d['e53_'+k+'_'+l]!==''&&d['e53_'+k+'_'+l]!=null)}
function isNoInsp(d){return d.insp==='No se inspeccionó'}

function refresh(){
  const d=cur;
  const no=isNoInsp(d);
  $('#noInsp').classList.toggle('hidden',!no);
  ONLY_INSP.forEach(id=>{$('#'+id).classList.toggle('hidden',no);const a=document.querySelector(`.nav a[data-s=${id}]`);if(a)a.classList.toggle('hidden',no)});
  const t=(parseInt(d.niv)||0)+(parseInt(d.sot)||0);form.querySelector('[name=totPisos]').value=(d.niv||d.sot)?t:'';
  E53.forEach(([k,,g])=>{
    const el=$('#sum_'+k);if(!any53(d,k)){el.textContent='';el.className='sum';return}
    const s=sum53(d,k);
    const tags=LV.map(([l,ln])=>{const i=rng(parseFloat(d['e53_'+k+'_'+l]),TH[g][l]);return i<0?'':`${ln} ${rngLbl(TH[g][l])[i]}`}).filter(Boolean).join(', ');
    el.textContent=`Suma ${s} %`+(Math.abs(s-100)>0.01?' (debe ser 100 %)':'')+(tags?` · Ficha: ${tags}`:'');
    el.className='sum'+(Math.abs(s-100)>0.01?' bad':'');
  });
  const ov=(d.habOv||[]).length>0;$('#ovBox').classList.toggle('hidden',!ov);
  const a=habAuto(d), f=habFinal(d);
  const box=$('#habBox'), sec=$('#habSec');
  [box,sec].forEach(b=>{b.className='hab'+(f&&!no?' h-'+f:'')});
  if(no){box.innerHTML='No inspeccionada<small>'+H(d.noMot||'Indique el motivo')+'</small>';sec.textContent='No aplica'}
  else if(!f){box.innerHTML='Sin clasificar<small>Complete los cuatro riesgos de la Sección 5</small>';sec.textContent='Sin clasificar'}
  else{const sub=ov&&d.habMan?`Corregida (calculada: ${a||'incompleta'})`:'Calculada';box.innerHTML=HABN[f]+'<small>'+sub+'</small>';sec.textContent=HABN[f]+' · '+sub}
}

function touch(){
  cur.updated=Date.now();
  if(cur.firma){cur.firma='';cur.firmaAt=0;renderSig();toast('Ficha modificada: la firma se retiró. Vuelva a firmar.')}
}
function renderSig(){
  const b=$('#sigBox');if(!b)return;const prof=ls.get('firma','');
  b.innerHTML=cur.firma
    ?`<span class="ok">Ficha firmada el ${new Date(cur.firmaAt).toLocaleString('es-CO')}</span><img src="${cur.firma}" alt="Firma"><span class="hint">Si modifica cualquier dato, la firma se retira automáticamente.</span>`
    :`<span>Ficha sin firmar.</span>${prof?'':'<span class="hint">Primero guarde su firma en «Inspector», desde la lista de fichas.</span>'}<button type="button" class="btn pri" id="bSign" ${prof?'':'disabled'}>Firmar ficha</button>`;
}
async function firmar(){
  Object.assign(cur,readForm());
  const m=missing(cur);
  if(m.length){dialog(`<p>No se puede firmar: hay ${m.length} campos pendientes.</p><ul>${m.map(x=>`<li>${H(x)}</li>`).join('')}</ul>`);return}
  if(!await dialog('<p>Al firmar, usted avala el contenido de esta ficha. ¿Firmar?</p>','Firmar'))return;
  cur.firma=ls.get('firma','');cur.firmaAt=Date.now();cur.updated=Date.now();await dbPut(cur);renderSig();toast('Ficha firmada');
}
function onInput(){
  Object.assign(cur,readForm());touch();refresh();
  clearTimeout(saveT);saveT=setTimeout(()=>dbPut(cur),400);
}

/* ---------- Validación ---------- */
function missing(d){
  const m=[];
  if(!d.formNo)m.push('Sección 1: número de formulario');
  if(!d.barrioNom&&!d.barrio)m.push('Sección 1: barrio o vereda');
  if(!d.insp)m.push('Sección 2: tipo de inspección');
  if(isNoInsp(d)){if(!d.noMot)m.push('Sección 2: motivo de no inspección')}
  else{
    if(!(d.dCra||d.dCll||d.dTv||d.dDg||d.dAv||d.dOtro))m.push('Sección 3: dirección');
    if(!d.lat||!d.lon)m.push('Sección 3: coordenadas GPS');
    if(d.niv==='')m.push('Sección 3: niveles sobre el terreno');
    if(!d.usoEd)m.push('Sección 3: uso de la edificación');
    if(!d.sist)m.push('Sección 4: sistema estructural');
    if(!d.colapso||!d.inclin)m.push('Sección 5.1: colapso e inclinación');
    if(!d.asent||!d.talud)m.push('Sección 5.2: asentamiento y talud');
    E53.forEach(([k,n])=>{if(!any53(d,k))m.push('Sección 5.3: '+n+' sin porcentajes');else if(Math.abs(sum53(d,k)-100)>0.01)m.push('Sección 5.3: '+n+' no suma 100 %')});
    [['r_global','estabilidad global'],['r_geo','geotécnico'],['r_est','estructural'],['r_noest','no estructural']].forEach(([k,n])=>{if(!d[k])m.push('Sección 5: riesgo '+n)});
    if(!d.pctGlobal)m.push('Sección 6: porcentaje global de daño');
    if((d.habOv||[]).length){if(!d.habMan)m.push('Sección 7: clasificación asignada');if(!(d.habJust||'').trim())m.push('Sección 7: justificación de la corrección')}
    if(!d.s10)m.push('Sección 10: muertos o heridos');
    if(!d.s11)m.push('Sección 11: ocupación');
  }
  if(!d.lider)m.push('Sección 14: líder de la comisión');
  if(!d.fecha)m.push('Sección 15: fecha');
  return m;
}

/* ---------- GPS ---------- */
function gps(){
  const info=$('#gpsInfo');
  if(!navigator.geolocation){info.textContent='Este navegador no permite GPS. Escriba las coordenadas.';return}
  info.textContent='Buscando señal GPS…';
  navigator.geolocation.getCurrentPosition(p=>{
    form.querySelector('[name=lat]').value=p.coords.latitude.toFixed(6);
    form.querySelector('[name=lon]').value=p.coords.longitude.toFixed(6);
    cur.gpsAcc=Math.round(p.coords.accuracy);info.textContent=`Precisión aproximada: ${cur.gpsAcc} m`;onInput();
  },e=>{info.textContent='No se obtuvo ubicación ('+e.message+'). Active la ubicación del celular o escriba las coordenadas.'},{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}

/* ---------- Esquema ---------- */
let strokes=[], drawing=null;
function skDraw(){
  const c=$('#sk'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='#d6dde8';x.lineWidth=1;for(let i=0;i<=c.width;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let j=0;j<=c.height;j+=30){x.beginPath();x.moveTo(0,j);x.lineTo(c.width,j);x.stroke()}
  x.strokeStyle='#111';x.lineWidth=4;x.lineCap=x.lineJoin='round';
  strokes.forEach(s=>{x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()});
}
function skSave(){cur.strokes=strokes;cur.esquema=strokes.length?$('#sk').toDataURL('image/jpeg',0.8):'';touch();dbPut(cur)}
function skInit(){
  const c=$('#sk');
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drawing=[pt(e)];strokes.push(drawing)};
  c.onpointermove=e=>{if(drawing){drawing.push(pt(e));skDraw()}};
  c.onpointerup=c.onpointercancel=()=>{if(drawing){drawing=null;skSave()}};
  $('#skU').onclick=()=>{strokes.pop();skDraw();skSave()};
  $('#skC').onclick=async()=>{if(await dialog('<p>¿Borrar todo el esquema?</p>','Borrar')){strokes=[];skDraw();skSave()}};
}

/* ---------- Fotos ---------- */
function shrink(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.72))};im.onerror=ko;im.src=u})}
function renderFotos(){
  $('#fotos').innerHTML=(cur.fotos||[]).map((f,i)=>`<figure><img src="${f.data}" alt="Foto ${i+1}"><input type="text" data-cap="${i}" placeholder="Foto ${i+1}: descripción" value="${H(f.cap)}"><button type="button" class="btn dan" data-delf="${i}">Quitar</button></figure>`).join('');
}

/* ---------- Navegación ---------- */
function show(v){$('#vList').classList.toggle('hidden',v!=='list');$('#vEdit').classList.toggle('hidden',v!=='edit');$('#bar').classList.toggle('hidden',v!=='edit');window.scrollTo(0,0)}
function nextNo(){const p=ls.get('prefijo','A');const n=(+ls.get('seq_'+p,'0'))+1;ls.set('seq_'+p,String(n));return `${p}-${String(n).padStart(3,'0')}`}
function today(){const d=new Date();const z=n=>String(n).padStart(2,'0');return{f:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,h:`${z(d.getHours())}:${z(d.getMinutes())}`}}
async function openFicha(d){

async function newFicha(){
  const t=today();
  const d={id:'f'+Date.now()+Math.random().toString(36).slice(2,6),created:Date.now(),updated:Date.now(),exportedAt:0,
    formNo:nextNo(),fecha:t.f,hora:t.h,lider:ls.get('nombre',''),comision:ls.get('comision',''),fotos:[],strokes:[],esquema:'',c_n:0};

async function renderList(){
  const all=(await dbAll()).sort((a,b)=>b.created-a.created);
  $('#cfgInfo').textContent=`Inspector: ${ls.get('nombre','sin nombre')} · prefijo ${ls.get('prefijo','A')}`;
  $('#list').innerHTML=all.length?all.map(d=>{
    const f=isNoInsp(d)?null:habFinal(d);const m=missing(d).length;
    const st=d.exportedAt?(d.updated>d.exportedAt?'Modificada después de exportar':'Exportada'):'Sin exportar';
    return `<div class="item ${f?'b-'+f:''}"><b>${H(d.formNo)} · ${H(d.barrioNom||d.barrio||'Sin barrio')}</b>
    <div class="meta">${H([d.dCra&&'Cra '+d.dCra,d.dCll&&'Cll '+d.dCll,d.dOtro].filter(Boolean).join(' ')||'Sin dirección')} · ${f?HABN[f]:(isNoInsp(d)?'No inspeccionada':'Sin clasificar')} · ${m?m+' pendientes':'Completa'} · ${d.firma?'Firmada':'Sin firmar'} · ${st}</div>
    <div class="row"><button class="btn" data-ed="${d.id}">Abrir</button><button class="btn" data-pr="${d.id}">PDF</button><button class="btn dan" data-del="${d.id}">Borrar</button></div></div>`}).join(''):'<p class="empty">No hay fichas en este celular. Toque «Nueva ficha» para empezar.</p>';
  const pend=all.filter(d=>!d.exportedAt||d.updated>d.exportedAt).length;
  $('#bClean').disabled=!all.some(d=>d.exportedAt&&d.updated<=d.exportedAt);
  $('#bExp').textContent=`Exportar jornada (${pend} sin exportar)`;

/* ---------- Exportación ---------- */
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function csv(all){
  const skip=new Set(['id','fotos','strokes','esquema','created','updated','exportedAt','firma','firmaAt']);
  const keys=[];all.forEach(d=>Object.keys(d).forEach(k=>{if(!skip.has(k)&&!keys.includes(k))keys.push(k)}));
  const cols=['formNo','firmada','habCalculada','habFinal','nFotos',...keys.filter(k=>k!=='formNo')];
  const q=v=>{v=Array.isArray(v)?v.join('; '):(v??'');v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=all.map(d=>cols.map(c=>c==='habCalculada'?(isNoInsp(d)?'':habAuto(d)||''):c==='habFinal'?(isNoInsp(d)?'No inspeccionada':habFinal(d)||''):c==='nFotos'?(d.fotos||[]).length:c==='firmada'?(d.firma?new Date(d.firmaAt).toLocaleString('es-CO'):'No'):d[c]).map(q).join(','));
  return '\ufeff'+cols.join(',')+'\n'+rows.join('\n');
}
async function exportar(){
  const all=await dbAll();if(!all.length){toast('No hay fichas para exportar');return}
  const inc=all.filter(d=>missing(d).length);
  if(inc.length&&!await dialog(`<p>${inc.length} ficha(s) tienen campos pendientes: ${inc.map(d=>H(d.formNo)).join(', ')}.</p><p>Puede exportar igual y completarlas después.</p>`,'Exportar igual'))return;
  const t=today().f, p=ls.get('prefijo','A');
  dl(`jornada_${t}_${p}.csv`,new Blob([csv(all)],{type:'text/csv;charset=utf-8'}));
  setTimeout(()=>dl(`respaldo_${t}_${p}.json`,new Blob([JSON.stringify({app:'inspAIS',v:1,fichas:all})],{type:'application/json'})),600);
  const now=Date.now();for(const d of all){d.exportedAt=now;await dbPut(d)}
  toast('Archivos descargados. Súbalos a Drive con los PDF.');renderList();
}
async function importar(file){
  try{const j=JSON.parse(await file.text());if(!j.fichas)throw 0;let n=0;for(const d of j.fichas){await dbPut(d);n++}toast(n+' fichas restauradas');renderList()}
  catch(e){toast('El archivo no es un respaldo válido de esta herramienta')}
}

/* ================= PDF con formato AIS ================= */
const bx=c=>`<span class="bx">${c?'X':''}</span>`;
const has=(v,o)=>Array.isArray(v)?v.includes(o):v===o;
const opts=(v,list,lab)=>`<div class="pr">${list.map((o,i)=>`<span>${bx(has(v,o))}${H(lab?lab[i]:o)}</span>`).join('')}</div>`;
const vl=v=>`<span class="vl">${H(v)}</span>`;
function pHead(d){return `<div class="ph"><img src="${LOGO.gob}" alt=""><img src="${LOGO.alc}" alt=""><div class="t">INSPECCIÓN DE EDIFICACIONES<br>DESPUÉS DE UN SISMO<br>FORMULARIO ÚNICO</div><div style="display:flex;gap:6px;align-items:center"><img src="${LOGO.ais}" alt=""><div class="n">Formulario número<b>${H(d.formNo)}</b></div></div></div>`}
function ficha(d){
  const no=isNoInsp(d), a=habAuto(d), f=habFinal(d), ov=(d.habOv||[]).length&&d.habMan;
  const g53=([k,n,g])=>{const th=TH[g];return `<tr><td class="l">${n}</td>${LV.map(([l])=>{const i=rng(parseFloat(d['e53_'+k+'_'+l]),th[l]);return [0,1,2].map(j=>`<td>${i===j?'X':''}</td>`).join('')}).join('')}<td>${H(d['e53_'+k+'_nin'])}</td><td>${any53(d,k)?sum53(d,k)+'%':''}</td></tr>`};
  const hd53=g=>`<tr><th class="l">${g==='A'?'Piso de mayor daño: '+H(d.pisoMax):'% respecto al total'}</th>${LV.map(([l])=>rngLbl(TH[g][l]).map(x=>`<th>${x}</th>`).join('')).join('')}<th>Ninguno</th><th>Suma</th></tr>`;
  const cm=Array.from({length:+d.c_n||0},(_,i)=>[d['c_sec_'+i],d['c_txt_'+i]]).filter(r=>r[0]||r[1]);
  if(ov)cm.unshift(['7',`Clasificación corregida de ${a?HABN[a]:'incompleta'} a ${HABN[d.habMan]}. Justificación: ${d.habJust||''}`]);
  if(d.gpsAcc)cm.push(['3',`Coordenadas tomadas con GPS del celular, precisión aproximada ${d.gpsAcc} m.`]);
  const insp=`
  <div class="ps"><h3>SECCIÓN 3. IDENTIFICACIÓN DE LA EDIFICACIÓN</h3>
   <div class="pr"><b>Dirección:</b> Carrera ${vl(d.dCra)} Calle ${vl(d.dCll)} Transv. ${vl(d.dTv)} Diag. ${vl(d.dDg)} Avda. ${vl(d.dAv)} Número ${vl(d.dNum)} Otro ${vl(d.dOtro)}</div>
   <div class="pr"><b>Nombre de la edificación:</b> ${vl(d.nombre)} <b>Coordenadas:</b> Lat ${vl(d.lat)} Lon ${vl(d.lon)}</div>
   <div class="pr"><b>Número de pisos:</b> Niveles sobre el terreno ${vl(d.niv)} Sótanos ${vl(d.sot)} Total ${vl(d.totPisos)} <b>Dimensiones:</b> Frente (m) ${vl(d.frente)} Fondo (m) ${vl(d.fondo)}</div>
   <div class="pr"><b>Uso predominante:</b> de la edificación ${vl(d.usoEd)} de la planta baja ${vl(d.usoPb)}</div></div>
  <div class="ps"><h3>SECCIÓN 4. DESCRIPCIÓN DE LA ESTRUCTURA</h3>
   <div class="pr"><b>Sistema estructural:</b> ${vl(d.sist)} <b>Tipo de entrepiso:</b> ${vl(d.entre)}</div>
   <div class="pr"><b>Año de construcción:</b></div>${opts(d.anio,ANIO)}</div>
  <div class="ps"><h3>SECCIÓN 5. ESTADO DE DAÑO DE LA EDIFICACIÓN</h3>
   <div class="two"><div><h4>5.1 Estabilidad global de la edificación</h4>
    <div class="pr"><b>Colapso:</b></div>${opts(d.colapso,['Total','Parcial >50%','Parcial ≤50%','Ninguno'])}
    <div class="pr"><b>Inclinación de la edificación o de algún entrepiso:</b></div>${opts(d.inclin,['Evidente','Existen dudas','Ninguna'])}
    <div class="pr"><b>Recomendaciones:</b></div>${opts(d.rec51,['Barreras externas, apuntalar','No entrar','Estudio de vulnerabilidad','Posible demolición'])}
    <div class="pr"><b>Riesgo estabilidad global:</b></div>${opts(d.r_global,R4)}</div>
   <div><h4>5.2 Problemas geotécnicos</h4>
    <div class="pr"><b>Asentamiento:</b></div>${opts(d.asent,['Evidente','Existen dudas','Ninguno'])}
    <div class="pr"><b>Falla en talud o movimiento en masa:</b></div>${opts(d.talud,['General','Puntual','Ninguno'])}
    <div class="pr"><b>Morfología:</b> ${vl(d.morfo)} <b>Potencial de reactivación:</b> ${vl(d.react)}</div>
    <div class="pr"><b>Recomendaciones:</b></div>${opts(d.rec52,['Remoción del material','Barreras','Contención provisional','Evacuar viviendas'])}
    <div class="pr"><b>Riesgo geotécnico:</b></div>${opts(d.r_geo,R4)}</div></div>
   <h4>5.3 Daños en elementos estructurales</h4>
   <table class="g"><tr><th></th><th colspan="3">Severo</th><th colspan="3">Fuerte</th><th colspan="3">Moderado</th><th colspan="3">Leve</th><th colspan="2"></th></tr>${hd53('A')}${E53.slice(0,2).map(g53).join('')}${hd53('B')}${E53.slice(2).map(g53).join('')}</table>
   <div class="two"><table class="g"><tr><th class="l">Medidas sugeridas</th><th>Reparar</th><th>Anclar</th><th>Apuntalar</th><th>Barreras</th></tr>${E53.map(([k,n])=>`<tr><td class="l">${n}</td>${['Reparar','Anclar','Apuntalar','Barreras'].map(o=>`<td>${has(d['e53m_'+k],o)?'X':''}</td>`).join('')}</tr>`).join('')}</table>
   <div><div class="pr"><b>Otras recomendaciones:</b></div>${opts(d.rec53,['Barreras externas','No entrar','Estudio de vulnerabilidad','Posible demolición'])}<div class="pr"><b>Riesgo estructural:</b></div>${opts(d.r_est,R4)}</div></div>
   <h4>5.4 Daños en elementos no estructurales</h4>
   <table class="g"><tr><th class="l">Elemento</th>${G5.map(x=>`<th>${x}</th>`).join('')}<th>Reparar</th><th>Anclar</th><th>Remover</th><th>Barreras internas</th></tr>
   ${E54.map(([k,n])=>`<tr><td class="l">${n}</td>${G5.map(x=>`<td>${d['e54_'+k]===x?'X':''}</td>`).join('')}${['Reparar','Anclar','Remover','Barreras internas'].map(o=>`<td>${has(d['e54m_'+k],o)?'X':''}</td>`).join('')}</tr>`).join('')}</table>
   <div class="pr"><b>Otras recomendaciones:</b></div>${opts(d.rec54,['Barreras externas','No entrar','Estudio de vulnerabilidad','Demoler elementos en peligro de caer'])}
   <div class="pr"><b>Riesgo no estructural:</b></div>${opts(d.r_noest,R3)}</div>
  <div class="ps"><h3>SECCIÓN 6. PORCENTAJE GLOBAL DE DAÑO DE LA EDIFICACIÓN</h3>${opts(d.pctGlobal,['Ninguno','0-10%','10-30%','30-60%','60-100%','100%'])}</div>
  <div class="ps"><h3>SECCIÓN 7. CLASIFICACIÓN DE LA HABITABILIDAD</h3>
   <table class="g"><tr><th>Riesgo estabilidad global</th><th>Riesgo geotécnico</th><th>Riesgo estructural</th><th>Riesgo no estructural</th><th>Calculada</th><th>Asignada</th></tr>
   <tr><td>${H(d.r_global)}</td><td>${H(d.r_geo)}</td><td>${H(d.r_est)}</td><td>${H(d.r_noest)}</td><td>${a?HABN[a]:''}</td><td class="hb">${f?HABN[f]:''}${ov?' (corregida, ver Sección 13)':''}</td></tr></table>
   ${opts(f,HAB,HAB.map(h=>HABN[h]))}</div>
  <div class="ps"><h3>SECCIÓN 8. CONDICIONES PREEXISTENTES</h3><div class="two">${S8.map(([k,l,o])=>`<div><div class="pr"><b>${l}:</b></div>${opts(d[k],o)}</div>`).join('')}</div></div>
  <div class="ps"><h3>SECCIÓN 9. RECOMENDACIONES Y MEDIDAS DE SEGURIDAD GENERALES</h3>
   <div class="pr"><b>Visita especializada por aspectos:</b></div>${opts(d.s9v,S9V)}
   <div class="pr"><b>Se recomienda intervención de:</b></div>${opts(d.s9i,S9I)}
   <div class="pr"><b>Medidas de seguridad:</b></div>${opts(d.s9m,S9M)}</div>
  <div class="two"><div class="ps"><h3>SECCIÓN 10. EFECTO EN LOS OCUPANTES</h3><div class="pr"><b>Hubo muertos o heridos:</b></div>${opts(d.s10,['1. No','2. Sí','3. No se sabe'])}<div class="pr">Fallecidos ${vl(d.muertos)} Heridos ${vl(d.heridos)}</div></div>
   <div class="ps"><h3>SECCIÓN 11. OCUPACIÓN DE LA EDIFICACIÓN</h3><div class="pr"><b>Habitada en el momento de la evaluación:</b></div>${opts(d.s11,['1. Sí','2. No'])}<div class="pr">Unidades existentes ${vl(d.uExist)} No habitables ${vl(d.uNoHab)}</div></div></div>
  <div class="ps"><h3>SECCIÓN 12. PERSONA PARA CONTACTO</h3><div class="pr">Nombres y apellidos ${vl(d.cNom)} Cédula ${vl(d.cCed)} Teléfono ${vl(d.cTel)}</div></div>`;
  const fotos=(d.fotos||[]);
  return `<table class="fx"><thead><tr><td>${pHead(d)}</td></tr></thead><tbody><tr><td>
  <div class="two">
   <div class="ps"><h3>SECCIÓN 1. IDENTIFICACIÓN CATASTRAL</h3><div class="pr">Comuna ${vl(d.comuna)} Barrio o vereda ${vl(d.barrioNom)}</div><div class="pr">Barrio ${vl(d.barrio)} Manzana ${vl(d.manzana)} Predio ${vl(d.predio)} Construcción ${vl(d.construc)}</div></div>
   <div class="ps"><h3>SECCIÓN 2. TIPO DE INSPECCIÓN</h3>${opts(d.insp,['Exterior solamente','Parcial','Completa interior y exterior','No se inspeccionó'])}${no?`<div class="pr"><b>No se inspeccionó porque:</b></div>${opts(d.noMot,['No se permitió','Desocupada','Colapso','Demolida','Otro motivo'])}${d.noOtro?`<div class="pr">${H(d.noOtro)}</div>`:''}`:''}</div>
  </div>
  ${no?'':insp}
  <div class="ps"><h3>SECCIÓN 13. COMENTARIOS</h3><table class="cm"><tr><td><b>Sección</b></td><td></td></tr>${(cm.length?cm:[['','']]).map(r=>`<tr><td>${H(r[0])}</td><td>${H(r[1])}</td></tr>`).join('')}</table></div>
  <div class="two"><div class="ps"><h3>SECCIÓN 14. INSPECTORES</h3><div class="pr">Código de la comisión ${vl(d.comision)} N.º de evaluadores ${vl(d.nEval)}</div>
   <div class="pr">Líder: ${vl(d.lider)} Firma <span class="sig">${d.firma?`<img src="${d.firma}" alt=""><small>Firmado ${new Date(d.firmaAt).toLocaleString('es-CO')}</small>`:''}</span></div></div>
   <div class="ps"><h3>SECCIÓN 15. FECHA DE INSPECCIÓN</h3><div class="pr">Fecha ${vl(d.fecha)} Hora (24:00) ${vl(d.hora)}</div></div></div>
  <div class="ps"><h3>SECCIÓN 16. ESQUEMA</h3>${d.esquema?`<img class="sk" src="${d.esquema}" alt="">`:'<div class="pr">Sin esquema.</div>'}</div>
  <div class="ps"><h3>SECCIÓN 17. FOTOGRAFÍAS</h3><div class="pr">${bx(fotos.length)}Sí ${bx(!fotos.length)}No · Cuántas: ${vl(fotos.length||'')}</div></div>
  ${fotos.length?`<div class="pf">${fotos.map((p,i)=>`<figure><img src="${p.data}" alt=""><figcaption>Foto ${i+1}. ${H(p.cap)}</figcaption></figure>`).join('')}</div>`:''}
  <div class="foot"><span>Formato: Versión 00, mayo 18 de 2003. Diseñó: Asociación Colombiana de Ingeniería Sísmica (AIS)</span><span>Generado ${new Date().toLocaleString('es-CO')}</span></div>
  </td></tr></tbody></table>`;
}
async function imprimir(list){
  const p=$('#print');p.innerHTML=list.map(ficha).join('');
  await Promise.all([...p.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  const old=document.title;if(list.length===1)document.title=`Ficha_${list[0].formNo}`;
  window.print();document.title=old;
}

/* ---------- Eventos ---------- */
form.addEventListener('input',e=>{if(e.target.dataset.cap!=null){cur.fotos[+e.target.dataset.cap].cap=e.target.value;touch();dbPut(cur);return}onInput()});
form.addEventListener('change',e=>{if(e.target.id==='fFoto')return;onInput()});
form.addEventListener('pointerdown',e=>{const l=e.target.closest('.chips label');if(l){const i=document.getElementById(l.htmlFor);if(i&&i.type==='radio')i.dataset.was=i.checked?'1':''}});
form.addEventListener('click',async e=>{
  const t=e.target;
  if(t.type==='radio'&&t.dataset.was==='1'){t.checked=false;t.dataset.was='';onInput();return}
  if(t.id==='bGps')gps();
  if(t.id==='bSign')firmar();
  if(t.id==='bCmt'){const n=(+cur.c_n||0)+1;Object.assign(cur,readForm());cur.c_n=n;renderCmts(n);fillForm(cur);onInput()}
  if(t.dataset.delf!=null&&await dialog('<p>¿Quitar esta foto?</p>','Quitar')){cur.fotos.splice(+t.dataset.delf,1);renderFotos();touch();dbPut(cur)}
});
form.addEventListener('change',async e=>{
  if(e.target.id!=='fFoto')return;
  const files=[...e.target.files];toast('Procesando '+files.length+' foto(s)…');
  for(const f of files){try{cur.fotos.push({data:await shrink(f),cap:''})}catch(_){toast('No se pudo leer una imagen')}}
  e.target.value='';renderFotos();touch();dbPut(cur);
});
$('#bNew').onclick=newFicha;
$('#bBack').onclick=async()=>{Object.assign(cur,readForm());await dbPut(cur);show('list');renderList()};
$('#bCheck').onclick=()=>{const m=missing(readFormSafe());dialog(m.length?`<p><b>${m.length} pendientes:</b></p><ul>${m.map(x=>`<li>${H(x)}</li>`).join('')}</ul>`:'<p>La ficha está completa.</p>')};
function readFormSafe(){Object.assign(cur,readForm());return cur}
$('#bPrint').onclick=async()=>{const d=readFormSafe();await dbPut(d);const m=missing(d);if(m.length&&!await dialog(`<p>Hay ${m.length} campos pendientes. ¿Generar el PDF de todas formas?</p>`,'Generar PDF'))return;imprimir([d])};
$('#list').addEventListener('click',async e=>{
  const t=e.target, all=await dbAll(), d=all.find(x=>x.id===(t.dataset.ed||t.dataset.pr||t.dataset.del));if(!d)return;
  if(t.dataset.ed)openFicha(d);
  if(t.dataset.pr)imprimir([d]);
  if(t.dataset.del){const exp=d.exportedAt&&d.updated<=d.exportedAt;if(await dialog(`<p>¿Borrar la ficha ${H(d.formNo)} de este celular?</p>${exp?'':'<p><b>Esta ficha no ha sido exportada.</b> Se perderá definitivamente.</p>'}`,'Borrar')){await dbDel(d.id);renderList()}}
});
$('#bExp').onclick=exportar;
$('#bPrintAll').onclick=async()=>{const all=(await dbAll()).sort((a,b)=>a.created-b.created);if(!all.length)return toast('No hay fichas');imprimir(all)};
$('#fImp').onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);e.target.value=''};
$('#bClean').onclick=async()=>{const all=await dbAll();const ok=all.filter(d=>d.exportedAt&&d.updated<=d.exportedAt);if(await dialog(`<p>Se borrarán ${ok.length} fichas ya exportadas. Confirme que ya subió los archivos a Drive.</p>`,'Ya subí, borrar')){for(const d of ok)await dbDel(d.id);renderList()}};
$('#bCfg').onclick=async()=>{
  const html=`<h3 style="margin-top:0">Datos del inspector</h3>${fld('Nombre completo (líder de la comisión)',`<input id="cfN" type="text" value="${H(ls.get('nombre',''))}">`)}${fld('Prefijo de numeración (una letra distinta por inspector)',`<input id="cfP" type="text" maxlength="3" value="${H(ls.get('prefijo','A'))}">`)}${fld('Código de la comisión',`<input id="cfC" type="text" value="${H(ls.get('comision',''))}">`)}
  <h3>Firma</h3><p class="hint">Firme con el dedo en el recuadro o suba una foto de su firma en papel blanco.</p>
  <canvas id="cfSig" width="900" height="300"></canvas>
  <div class="row" style="margin-top:6px"><button type="button" class="btn" id="cfClr">Borrar firma</button><label class="btn" for="cfUp">Subir imagen</label><input type="file" id="cfUp" accept="image/*" class="hidden"></div>`;
  const pend=dialog(html,'Guardar');sigPad(ls.get('firma',''));
  if(await pend){ls.set('nombre',$('#cfN').value.trim());if(sigDirty)ls.set('firma',sigData());ls.set('prefijo',($('#cfP').value.trim()||'A').toUpperCase());ls.set('comision',$('#cfC').value.trim());renderList()}
};

let sigDirty=false,sigInk=false;
function sigPad(init){
  const c=$('#cfSig'),x=c.getContext('2d');sigDirty=false;sigInk=!!init;
  const clear=()=>{x.clearRect(0,0,c.width,c.height)};
  const put=src=>{const im=new Image();im.onload=()=>{clear();const k=Math.min(c.width/im.width,c.height/im.height);const w=im.width*k,h=im.height*k;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)};im.src=src};
  if(init)put(init);
  x.lineWidth=5;x.lineCap=x.lineJoin='round';x.strokeStyle='#0a2a6b';
  let on=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);on=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);sigDirty=sigInk=true};
  c.onpointermove=e=>{if(!on)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{on=false};
  $('#cfClr').onclick=()=>{clear();sigDirty=true;sigInk=false};
  $('#cfUp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await shrink(f);put(d);sigDirty=sigInk=true}catch(_){toast('No se pudo leer la imagen')}};
}
function sigData(){return sigInk?$('#cfSig').toDataURL('image/png'):''}
window.addEventListener('beforeunload',()=>{if(cur&&!$('#vEdit').classList.contains('hidden')){Object.assign(cur,readForm());dbPut(cur)}});

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
openDB().then(renderList).catch(()=>{$('#list').innerHTML='<p class="empty">Este navegador no permite guardar fichas. Abra la herramienta en Chrome.</p>'});
</script>
</body>
</html>

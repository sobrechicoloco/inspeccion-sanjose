<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspección post-sismo · San José, Caldas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6b45">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#ffffff; --field:#f1f4f2; --ink:#1b2420; --muted:#5a6660; --line:#c8d0cb;
  --brand:#1f6b45; --brand-ink:#ffffff; --warn:#b3261e;
  --verde:#2e8b57; --amarillo:#e3b400; --naranja:#e07b1f; --rojo:#c62828;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#16201b;--field:#202c26;--ink:#e6ece8;--muted:#9fb0a7;--line:#34443c;--brand:#4fae7c;--brand-ink:#08130d;--warn:#ff8a80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:0 14px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--brand)}
header.top img{height:44px;border-radius:4px;background:#fff}
header.top h1{font-size:1.05rem;margin:0;line-height:1.2}
header.top small{color:var(--muted);display:block;font-weight:400}
.btn{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:10px 14px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.dan{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chips input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{margin:16px 0;display:grid;gap:8px}
.item{border:1px solid var(--line);border-left:8px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.item b{font-size:1.05rem}
.item .meta{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted);padding:24px 0}
.nav{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line)}
.nav a{flex:none;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
section.s{padding:14px 0 6px;border-bottom:1px solid var(--line);scroll-margin-top:52px}
section.s>h2{font-size:1.05rem;margin:0 0 10px;color:var(--brand)}
h3{font-size:.95rem;margin:14px 0 6px}
.fld{display:grid;gap:4px;margin:8px 0}
.lbl{font-size:.88rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 10px;font-size:.92rem;user-select:none}
.chips input:checked+label{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.el{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.el>b{display:block;margin-bottom:6px}
.pct{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pct label{font-size:.78rem;color:var(--muted);display:grid;gap:2px}
.sum{font-size:.85rem;margin-top:6px}
.sum.bad{color:var(--warn);font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0}
.hidden{display:none!important}
.gps{display:flex;gap:8px;align-items:end}
canvas#sk{width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fotos figure{margin:0;border:1px solid var(--line);border-radius:6px;padding:4px;display:grid;gap:4px}
.fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hab{flex:1;border-radius:8px;padding:8px 12px;font-weight:700;background:var(--field);color:var(--ink);border:1px solid var(--line);min-height:44px;display:flex;flex-direction:column;justify-content:center}
.hab small{font-weight:400;font-size:.78rem}
.h-Verde{background:var(--verde);color:#fff;border-color:var(--verde)}
.h-Amarillo{background:var(--amarillo);color:#1b1b1b;border-color:var(--amarillo)}
.h-Naranja{background:var(--naranja);color:#fff;border-color:var(--naranja)}
.h-Rojo{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.b-Verde{border-left-color:var(--verde)}.b-Amarillo{border-left-color:var(--amarillo)}.b-Naranja{border-left-color:var(--naranja)}.b-Rojo{border-left-color:var(--rojo)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:min(560px,92vw)}
dialog ul{padding-left:18px}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;display:grid;gap:8px}
.sigbox img{max-height:70px;max-width:100%;background:#fff;border-radius:4px}
.ok{color:var(--brand);font-weight:600}
canvas#cfSig{width:100%;aspect-ratio:3/1;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;z-index:20;font-size:.9rem}
#print{display:none}


.cnt{font-size:.75rem;color:var(--muted);text-align:right}
.cnt.bad{color:var(--warn);font-weight:600}
.gpsok{color:var(--verde);font-weight:600}.gpslow{color:var(--naranja);font-weight:600}
#skPrev{width:100%;aspect-ratio:1170/614;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.skx{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
.skx .tb{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px;border-bottom:1px solid var(--line);align-items:center}
.skx .tb .btn{padding:6px 9px;font-size:.85rem;flex:none;white-space:nowrap}
@media (max-height:520px){.skx .hint{display:none}}
.skx select{width:auto;flex:none}
.skx .tb .btn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.skx .cv{flex:1;display:grid;place-items:center;overflow:hidden;padding:4px}
.skx canvas{background:#fff;touch-action:none;border:1px solid var(--line)}
.skx .hint{margin:0 6px}

/* ================= IMPRESIÓN sobre la ficha oficial AIS ================= */
@page{size:letter;margin:0}
@media print{
  :root{padding:0;color-scheme:light}
  html,body{background:#fff;margin:0}
  .app,.bar,dialog,.toast,.skx{display:none!important}
  #print{display:block}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg{position:relative;width:612pt;height:792pt;overflow:hidden;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg img.bg{position:absolute;left:0;top:0;width:612pt;height:792pt}
  .a{position:absolute}
  .x{font:700 9pt Arial,Helvetica,sans-serif;color:#0a2a6b;transform:translate(-50%,-52%);line-height:1}
  .t{font-family:Arial,Helvetica,sans-serif;color:#0a2a6b;line-height:1.08;display:flex;align-items:center;overflow:hidden;white-space:pre;padding:0 1.5pt;box-sizing:border-box}
  .t.c{justify-content:center;text-align:center}
  .w{background:#fff}
  .bxl{border:1px solid #000;box-sizing:border-box}
  .lab{font:7pt Arial,Helvetica,sans-serif;color:#000;display:flex;align-items:center;justify-content:center}
  .ph img{width:100%;object-fit:contain;display:block}
  .ph div{font:6pt Arial,Helvetica,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000}
  .anx h2{font:700 10pt Arial,Helvetica,sans-serif;margin:0}
}
</style>

function build(){

function readForm(){
  const o={};
  form.querySelectorAll('input[type=checkbox]').forEach(e=>{o[e.name]=o[e.name]||[]});
  form.querySelectorAll('[name]').forEach(e=>{
    if(e.type==='radio'){if(e.checked)o[e.name]=e.value;else if(!(e.name in o))o[e.name]=''}
    else if(e.type==='checkbox'){if(e.checked)o[e.name].push(e.value)}
    else o[e.name]=e.value;
  });
  return o;
}
function fillForm(d){
  renderCmts(+d.c_n||0);
  form.querySelectorAll('[name]').forEach(e=>{
    const v=d[e.name];
    if(e.type==='radio')e.checked=(v===e.value);
    else if(e.type==='checkbox')e.checked=Array.isArray(v)&&v.includes(e.value);
    else e.value=v??'';

}

/* ---------- Lógica derivada ---------- */
function habAuto(d){
  const r=[d.r_global,d.r_geo,d.r_est,d.r_noest];
  if(r.some(x=>!x))return null;
  const alto=r.filter(x=>x==='Alto').length;
  if(r.includes('Muy alto')||alto>2)return 'Rojo';
  if(alto)return 'Naranja';
  if(r.includes('Bajo después de medidas'))return 'Amarillo';
  return 'Verde';
}
function habFinal(d){return (d.habOv||[]).length&&d.habMan?d.habMan:habAuto(d)}
function rng(v,[hi,lo]){if(!(v>0))return -1;return v>hi?0:(v>=lo?1:2)}
function rngLbl([hi,lo]){return [`>${hi}%`,`${lo}-${hi}%`,`<${lo}%`]}
function sum53(d,k){return ['sev','fue','mod','lev','nin'].reduce((a,l)=>a+(parseFloat(d['e53_'+k+'_'+l])||0),0)}
function any53(d,k){return ['sev','fue','mod','lev','nin'].some(l=>d['e53_'+k+'_'+l]!==''&&d['e53_'+k+'_'+l]!=null)}
function isNoInsp(d){return d.insp==='No se inspeccionó'}

function refresh(){
  const d=cur;
  const no=isNoInsp(d);
  $('#noInsp').classList.toggle('hidden',!no);
  const gate=(id,on,keys)=>{$(id).classList.toggle('hidden',!on);if(!on)keys.forEach(k=>{if(d[k]){d[k]='';form.querySelectorAll(`[name=${k}]`).forEach(e=>{if(e.type==='radio'||e.type==='checkbox')e.checked=false;else e.value=''})}})};
  gate('#wOtro',d.noMot==='Otro motivo',['noOtro']);
  gate('#w_s8g',d.s8f==='1. Sí',['s8g']);
  gate('#wHer',d.s10==='2. Sí',['muertos','heridos']);
  form.querySelectorAll('.cnt').forEach(s=>{const k=s.dataset.for,e=form.querySelector(`[name=${k}]`),n=e.maxLength-(e.value||'').length;s.textContent=e.value?`quedan ${n} caracteres`:`máximo ${e.maxLength} caracteres`;s.className='cnt'+(n<=0?' bad':'')});
  const L=cmtLayout(d),ci=$('#cmtInfo');if(ci){ci.textContent=`Usa ${L.length} de ${CMT_ROWS.length} líneas de la ficha`+(L.length>CMT_ROWS.length?' — se excede: acorte los comentarios':'');ci.className='hint'+(L.length>CMT_ROWS.length?' cnt bad':'')}
  ONLY_INSP.forEach(id=>{$('#'+id).classList.toggle('hidden',no);const a=document.querySelector(`.nav a[data-s=${id}]`);if(a)a.classList.toggle('hidden',no)});
  const t=(parseInt(d.niv)||0)+(parseInt(d.sot)||0);form.querySelector('[name=totPisos]').value=(d.niv||d.sot)?t:'';
  E53.forEach(([k,,g])=>{
    const el=$('#sum_'+k);if(!any53(d,k)){el.textContent='';el.className='sum';return}
    const s=sum53(d,k);
    const tags=LV.map(([l,ln])=>{const i=rng(parseFloat(d['e53_'+k+'_'+l]),TH[g][l]);return i<0?'':`${ln} ${rngLbl(TH[g][l])[i]}`}).filter(Boolean).join(', ');
    el.textContent=`Suma ${s} %`+(Math.abs(s-100)>0.01?' (debe ser 100 %)':'')+(tags?` · Ficha: ${tags}`:'');
    el.className='sum'+(Math.abs(s-100)>0.01?' bad':'');
  });
  const ov=(d.habOv||[]).length>0;$('#ovBox').classList.toggle('hidden',!ov);
  const a=habAuto(d), f=habFinal(d);
  const box=$('#habBox'), sec=$('#habSec');
  [box,sec].forEach(b=>{b.className='hab'+(f&&!no?' h-'+f:'')});
  if(no){box.innerHTML='No inspeccionada<small>'+H(d.noMot||'Indique el motivo')+'</small>';sec.textContent='No aplica'}
  else if(!f){box.innerHTML='Sin clasificar<small>Complete los cuatro riesgos de la Sección 5</small>';sec.textContent='Sin clasificar'}
  else{const sub=ov&&d.habMan?`Corregida (calculada: ${a||'incompleta'})`:'Calculada';box.innerHTML=HABN[f]+'<small>'+sub+'</small>';sec.textContent=HABN[f]+' · '+sub}
}

async function firmar(){
  Object.assign(cur,readForm());
  const m=missing(cur);
  if(m.length){dialog(`<p>No se puede firmar: hay ${m.length} campos pendientes.</p><ul>${m.map(x=>`<li>${H(x)}</li>`).join('')}</ul>`);return}
  if(!await dialog('<p>Al firmar, usted avala el contenido de esta ficha. ¿Firmar?</p>','Firmar'))return;
  cur.firma=ls.get('firma','');cur.firmaAt=Date.now();cur.updated=Date.now();await dbPut(cur);renderSig();toast('Ficha firmada');
}

}

/* ---------- Validación ---------- */
function missing(d){
  const m=[];
  if(!d.formNo)m.push('Sección 1: número de formulario');
  if(!d.barrioNom)m.push('Sección 1: barrio o vereda');
  if(!d.insp)m.push('Sección 2: tipo de inspección');
  if(isNoInsp(d)){if(!d.noMot)m.push('Sección 2: motivo de no inspección')}
  else{
    if(!(d.dCra||d.dCll||d.dTv||d.dDg||d.dAv||d.dOtro))m.push('Sección 3: dirección');
    if(!d.lat||!d.lon)m.push('Sección 3: coordenadas GPS');
    if(d.niv==='')m.push('Sección 3: niveles sobre el terreno');
    if(!d.usoEd)m.push('Sección 3: uso de la edificación');
    if(!d.sist)m.push('Sección 4: sistema estructural');
    if(!d.colapso||!d.inclin)m.push('Sección 5.1: colapso e inclinación');
    if(!d.asent||!d.talud)m.push('Sección 5.2: asentamiento y talud');
    E53.forEach(([k,n])=>{if(!any53(d,k))m.push('Sección 5.3: '+n+' sin porcentajes');else if(Math.abs(sum53(d,k)-100)>0.01)m.push('Sección 5.3: '+n+' no suma 100 %')});
    [['r_global','estabilidad global'],['r_geo','geotécnico'],['r_est','estructural'],['r_noest','no estructural']].forEach(([k,n])=>{if(!d[k])m.push('Sección 5: riesgo '+n)});
    if(!d.pctGlobal)m.push('Sección 6: porcentaje global de daño');
    if((d.habOv||[]).length){if(!d.habMan)m.push('Sección 7: clasificación asignada');if(!(d.habJust||'').trim())m.push('Sección 7: justificación de la corrección')}
    if(!d.s10)m.push('Sección 10: muertos o heridos');
    if(!d.s11)m.push('Sección 11: ocupación');
  }
  if(cmtLayout(d).length>CMT_ROWS.length)m.push('Sección 13: los comentarios exceden las líneas de la ficha');
  if(!d.lider)m.push('Sección 14: líder de la comisión');
  if(!d.fecha)m.push('Sección 15: fecha');
  return m;
}

/* ---------- GPS: 20 s, conserva la mejor lectura ---------- */
let gpsPend=null;
function gpsShow(){
  const i=$('#gpsInfo');if(!i)return;
  if(cur.gpsAcc==='')i.innerHTML='Coordenadas escritas a mano.';
  else if(cur.gpsAcc!=null&&cur.lat)i.innerHTML=cur.gpsAcc<=10?`<span class="gpsok">Precisión ${cur.gpsAcc} m ✓</span>`:`<span class="gpslow">Precisión ${cur.gpsAcc} m (aceptada; queda anotada en comentarios)</span>`;
  else i.textContent='';
}
function gpsApply(p){
  form.querySelector('[name=lat]').value=p.coords.latitude.toFixed(6);
  form.querySelector('[name=lon]').value=p.coords.longitude.toFixed(6);
  Object.assign(cur,readForm());cur.gpsAcc=Math.round(p.coords.accuracy);gpsPend=null;touch();refresh();dbPut(cur);gpsShow();
}
function gps(){
  const info=$('#gpsInfo');
  if(!navigator.geolocation){info.textContent='Este navegador no permite GPS. Escriba las coordenadas.';return}
  let best=null,done=false;const t0=Date.now();
  info.textContent='Buscando señal GPS…';
  const finish=()=>{if(done)return;done=true;clearTimeout(tm);clearInterval(tk);navigator.geolocation.clearWatch(id);
    if(!best){info.textContent='No se obtuvo ubicación. Salga a cielo abierto y reintente, o escriba las coordenadas.';return}
    const acc=Math.round(best.coords.accuracy);
    if(acc<=10)gpsApply(best);
    else{gpsPend=best;info.innerHTML=`<span class="gpslow">La mejor precisión fue ${acc} m (más de 10 m).</span><div class="row" style="margin-top:6px"><button type="button" class="btn" id="gpsRetry">Reintentar</button><button type="button" class="btn" id="gpsAccept">Aceptar así</button></div>`}};
  const id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;if(best.coords.accuracy<=5)finish()},
    e=>{if(e.code===1){done=true;clearTimeout(tm);clearInterval(tk);navigator.geolocation.clearWatch(id);info.textContent='Permiso de ubicación negado. Actívelo en Chrome (candado junto a la dirección) o escriba las coordenadas.'}},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
  const tk=setInterval(()=>{if(!done)info.textContent=`Buscando señal GPS… ${Math.round((Date.now()-t0)/1000)} s`+(best?` · mejor precisión ${Math.round(best.coords.accuracy)} m`:'')},1000);
  const tm=setTimeout(finish,20000);
}

const CMT_X=[52,108,571],CMT_PT=7;
let _mc;function mw(s,pt){_mc=_mc||document.createElement('canvas').getContext('2d');_mc.font=`${pt}pt Arial, Helvetica, sans-serif`;return _mc.measureText(s).width*0.75}
function wrap(txt,width,pt){
  const out=[];String(txt).split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{
    while(mw(w,pt)>width){let k=w.length;while(k>1&&mw(w.slice(0,k),pt)>width)k--;if(line){out.push(line);line=''}out.push(w.slice(0,k));w=w.slice(k)}
    const tst=line?line+' '+w:w;if(mw(tst,pt)<=width)line=tst;else{out.push(line);line=w}});if(line)out.push(line)});return out;
}
function cmtItems(d){
  const it=[];const no=isNoInsp(d);
  if(!no&&(d.habOv||[]).length&&d.habMan){const a=habAuto(d);it.push(['7',`Clasificación corregida de ${a?HABN[a]:'(incompleta)'} a ${HABN[d.habMan]}. Justificación: ${d.habJust||''}`])}
  if(no&&d.noMot==='Otro motivo'&&d.noOtro)it.push(['2','No se inspeccionó por: '+d.noOtro]);
  if(d.gpsAcc>10&&d.lat)it.push(['3',`Coordenadas tomadas con precisión aproximada de ${d.gpsAcc} m.`]);
  for(let i=0;i<(+d.c_n||0);i++)if(d['c_sec_'+i]||d['c_txt_'+i])it.push([d['c_sec_'+i]||'',d['c_txt_'+i]||'']);
  return it;
}
function cmtLayout(d){const L=[];const w=CMT_X[2]-CMT_X[1]-4;cmtItems(d).forEach(([s,x])=>{const ls=wrap(x,w,CMT_PT);(ls.length?ls:['']).forEach((l,i)=>L.push([i?'':s,l]))});return L}

/* ---------- Esquema: editor a pantalla completa ---------- */
const SKW=1170,SKH=614,SKC=39,SKR=26,CW=SKW/SKC,CH=SKH/SKR;
function skRender(ctx,items,grid,prev){
  ctx.clearRect(0,0,SKW,SKH);
  const L=document.createElement('canvas');L.width=SKW;L.height=SKH;const x=L.getContext('2d');
  x.lineCap=x.lineJoin='round';
  [...items,...(prev?[prev]:[])].forEach(it=>{
    x.globalCompositeOperation=it.t==='erase'?'destination-out':'source-over';
    x.strokeStyle=x.fillStyle='#111';x.lineWidth=it.t==='erase'?it.w:3;
    if(it.t==='free'||it.t==='erase'){x.beginPath();it.p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(it.p.length===1)x.lineTo(it.p[0][0]+.1,it.p[0][1]);x.stroke()}
    else if(it.t==='line'){x.beginPath();x.moveTo(it.a[0],it.a[1]);x.lineTo(it.b[0],it.b[1]);x.stroke()}
    else if(it.t==='rect'){x.strokeRect(Math.min(it.a[0],it.b[0]),Math.min(it.a[1],it.b[1]),Math.abs(it.b[0]-it.a[0]),Math.abs(it.b[1]-it.a[1]))}
    else if(it.t==='text'){x.font='600 24px Arial, sans-serif';x.textBaseline='middle';x.fillText(it.s,it.a[0],it.a[1])}
  });
  if(grid){ctx.fillStyle='#fff';ctx.fillRect(0,0,SKW,SKH);ctx.strokeStyle='#aebccd';ctx.lineWidth=1;
    for(let i=0;i<=SKC;i++){ctx.beginPath();ctx.moveTo(i*CW,0);ctx.lineTo(i*CW,SKH);ctx.stroke()}
    for(let j=0;j<=SKR;j++){ctx.beginPath();ctx.moveTo(0,j*CH);ctx.lineTo(SKW,j*CH);ctx.stroke()}}
  ctx.drawImage(L,0,0);return L;
}
function skItems(){if(cur.sk)return cur.sk;if(cur.strokes&&cur.strokes.length)return cur.strokes.map(s=>({t:'free',p:s.map(q=>[q[0]*SKW/1200,q[1]*SKH/900])}));return []}
function skPreview(){const c=$('#skPrev');if(c)skRender(c.getContext('2d'),skItems(),true)}
function skEditor(){
  let items=skItems().slice(),redo=[],tool='line',mag=true,ew=24,act=null;
  const ov=document.createElement('div');ov.className='skx';
  ov.innerHTML=`<div class="tb">
   <button class="btn" data-t="line">Línea</button><button class="btn" data-t="rect">Rectángulo</button><button class="btn" data-t="free">Mano alzada</button><button class="btn" data-t="text">Texto</button><button class="btn" data-t="erase">Borrador</button>
   <select id="skEw" class="btn" aria-label="Grosor del borrador"><option value="12">Borrador fino</option><option value="24" selected>Borrador medio</option><option value="48">Borrador grueso</option></select>
   <button class="btn on" id="skMag">Imán: sí</button><button class="btn" id="skUn">Deshacer</button><button class="btn" id="skRe">Rehacer</button><button class="btn dan" id="skCl">Borrar todo</button><button class="btn pri" id="skOk">Listo</button></div>
   <p class="hint">El imán ajusta líneas y rectángulos a la cuadrícula y las líneas a 0°, 45° y 90°. Para una puerta, dibuje el rectángulo y bórrele un tramo.</p>
   <div class="cv"><canvas width="${SKW}" height="${SKH}"></canvas></div>`;
  document.body.appendChild(ov);
  const c=ov.querySelector('canvas'),ctx=c.getContext('2d'),wrapEl=ov.querySelector('.cv');
  const fitC=()=>{const W=wrapEl.clientWidth-8,H=wrapEl.clientHeight-8,k=Math.min(W/SKW,H/SKH);c.style.width=SKW*k+'px';c.style.height=SKH*k+'px'};
  const draw=()=>skRender(ctx,items,true,act);
  const setTool=t=>{tool=t;ov.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))};setTool('line');
  try{document.documentElement.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}
  window.addEventListener('resize',fitC);setTimeout(()=>{fitC();draw()},60);fitC();draw();
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*SKW/r.width,(e.clientY-r.top)*SKH/r.height]};
  const node=p=>[Math.round(p[0]/CW)*CW,Math.round(p[1]/CH)*CH];
  const lineEnd=(a,p)=>{if(!mag)return p;const dx=p[0]-a[0],dy=p[1]-a[1],ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),len=Math.hypot(dx,dy);let b=[a[0]+Math.cos(ang)*len,a[1]+Math.sin(ang)*len];
    if(Math.abs(Math.sin(ang))<1e-6)b=[Math.round(b[0]/CW)*CW,a[1]];else if(Math.abs(Math.cos(ang))<1e-6)b=[a[0],Math.round(b[1]/CH)*CH];return b};
  c.onpointerdown=async e=>{const p=pt(e);
    if(tool==='text'){const ok=await dialog(`<h3 style="margin-top:0">Texto en el esquema</h3><input id="skTx" type="text" maxlength="40" placeholder="Ej.: cocina, fisura 45°, N">`,'Agregar');const s=ok&&$('#skTx')?$('#skTx').value.trim():'';if(s){items.push({t:'text',a:mag?node(p):p,s});redo=[];draw()}return}
    c.setPointerCapture(e.pointerId);
    if(tool==='free'||tool==='erase')act={t:tool,p:[p],w:ew};else{const a=mag?node(p):p;act={t:tool,a,b:a}}draw()};
  c.onpointermove=e=>{if(!act)return;const p=pt(e);if(act.p)act.p.push(p);else act.b=act.t==='line'?lineEnd(act.a,p):(mag?node(p):p);draw()};
  c.onpointerup=c.onpointercancel=()=>{if(!act)return;const ok=act.p||Math.hypot(act.b[0]-act.a[0],act.b[1]-act.a[1])>4;if(ok){items.push(act);redo=[]}act=null;draw()};
  ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
  ov.querySelector('#skEw').onchange=e=>{ew=+e.target.value;setTool('erase')};
  ov.querySelector('#skMag').onclick=e=>{mag=!mag;e.target.textContent='Imán: '+(mag?'sí':'no');e.target.classList.toggle('on',mag)};
  ov.querySelector('#skUn').onclick=()=>{if(items.length){redo.push(items.pop());draw()}};
  ov.querySelector('#skRe').onclick=()=>{if(redo.length){items.push(redo.pop());draw()}};
  ov.querySelector('#skCl').onclick=async()=>{if(await dialog('<p>¿Borrar todo el esquema?</p>','Borrar')){items=[];redo=[];draw()}};
  ov.querySelector('#skOk').onclick=()=>{
    window.removeEventListener('resize',fitC);
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
    if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
    const changed=JSON.stringify(items)!==JSON.stringify(skItems());
    if(changed){const lay=document.createElement('canvas');lay.width=SKW;lay.height=SKH;skRender(lay.getContext('2d'),items,false);
      cur.sk=items;delete cur.strokes;cur.esquema=items.length?lay.toDataURL('image/png'):'';touch();dbPut(cur)}
    ov.remove();skPreview();
  };
}

/* ---------- Exportación ---------- */
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function csv(all){
  const skip=new Set(['id','fotos','strokes','sk','esquema','created','updated','exportedAt','firma','firmaAt','c_n']);
  const keys=[];all.forEach(d=>Object.keys(d).forEach(k=>{if(!skip.has(k)&&!keys.includes(k))keys.push(k)}));
  const cols=['rud','edif','formNo','firmada','habCalculada','habFinal','nFotos',...keys.filter(k=>!['rud','edif','formNo'].includes(k))];
  const q=v=>{v=Array.isArray(v)?v.join('; '):(v??'');v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=all.map(d=>cols.map(c=>c==='habCalculada'?(isNoInsp(d)?'':habAuto(d)||''):c==='habFinal'?(isNoInsp(d)?'No inspeccionada':habFinal(d)||''):c==='nFotos'?(d.fotos||[]).length:c==='firmada'?(d.firma?new Date(d.firmaAt).toLocaleString('es-CO'):'No'):d[c]).map(q).join(','));
  return '\ufeff'+cols.join(',')+'\n'+rows.join('\n');
}
async function exportar(){
  const all=await dbAll();if(!all.length){toast('No hay fichas para exportar');return}
  const inc=all.filter(d=>missing(d).length);
  if(inc.length&&!await dialog(`<p>${inc.length} ficha(s) tienen campos pendientes: ${inc.map(d=>H(d.formNo)).join(', ')}.</p><p>Puede exportar igual y completarlas después.</p>`,'Exportar igual'))return;
  const t=today().f, p=ls.get('prefijo','A');
  dl(`jornada_${t}_${p}.csv`,new Blob([csv(all)],{type:'text/csv;charset=utf-8'}));
  setTimeout(()=>dl(`respaldo_${t}_${p}.json`,new Blob([JSON.stringify({app:'inspAIS',v:1,fichas:all})],{type:'application/json'})),600);
  const now=Date.now();for(const d of all){d.exportedAt=now;await dbPut(d)}
  toast('Archivos descargados. Súbalos a Drive con los PDF.');renderList();
}
async function importar(file){
  try{const j=JSON.parse(await file.text());if(!j.fichas)throw 0;let n=0;for(const d of j.fichas){await dbPut(d);n++}toast(n+' fichas restauradas');renderList()}
  catch(e){toast('El archivo no es un respaldo válido de esta herramienta')}
}

  const grid=(arr,x0,y0,W,Hh,off,fix)=>{const n=arr.length;const [c,r]=fix||[[1,1],[1,1],[2,1],[3,1],[2,2],[3,2],[3,2]][n];const g=6,cw=(W-(c-1)*g)/c,ch=(Hh-(r-1)*g)/r;
    return arr.map((p,i)=>`<div class="a ph" style="left:${x0+(i%c)*(cw+g)}pt;top:${y0+Math.floor(i/c)*(ch+g)}pt;width:${cw}pt"><img src="${p.data}" style="height:${ch-9}pt" alt=""><div>Foto ${off+i+1}. ${H(p.cap)}</div></div>`).join('')};
  P[3].push(grid(fs.slice(0,6),46,414,520,334,0));
  let html=P.map((p,i)=>`<div class="pg"><img class="bg" src="${BG[i]}" alt="">${p.join('')}</div>`).join('');
  for(let i=6;i<fs.length;i+=4){const ch=fs.slice(i,i+4);
    html+=`<div class="pg anx"><img class="a" src="${LOGO.gob}" style="left:40pt;top:28pt;height:40pt" alt=""><img class="a" src="${LOGO.alc}" style="left:96pt;top:24pt;height:46pt" alt=""><div class="a" style="left:160pt;top:36pt"><h2>ANEXO FOTOGRÁFICO · SECCIÓN 17</h2><div style="font:8pt Arial,sans-serif">Formulario n.º ${H(d.formNo)} · ${H(d.barrioNom||'')}</div></div>${grid(ch,40,90,532,660,i,[2,2])}</div>`}
  return html;
}
async function imprimir(list){
  const p=$('#print');p.innerHTML=list.map(pdfPages).join('');
  await Promise.all([...p.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  const old=document.title;if(list.length===1)document.title=`Ficha_${list[0].formNo}`;
  window.print();document.title=old;
}

/* ---------- Eventos ---------- */
form.addEventListener('input',e=>{if(e.target.name==='lat'||e.target.name==='lon'){cur.gpsAcc='';setTimeout(gpsShow,0)}if(e.target.dataset.cap!=null){cur.fotos[+e.target.dataset.cap].cap=e.target.value;touch();dbPut(cur);return}onInput()});
form.addEventListener('change',e=>{if(e.target.id==='fFoto')return;onInput()});
form.addEventListener('pointerdown',e=>{const l=e.target.closest('.chips label');if(l){const i=document.getElementById(l.htmlFor);if(i&&i.type==='radio')i.dataset.was=i.checked?'1':''}});
form.addEventListener('click',async e=>{
  const t=e.target;
  if(t.type==='radio'&&t.dataset.was==='1'){t.checked=false;t.dataset.was='';onInput();return}
  if(t.id==='bGps')gps();
  if(t.id==='gpsRetry')gps();
  if(t.id==='gpsAccept'&&gpsPend)gpsApply(gpsPend);
  if(t.id==='skOpen')skEditor();
  if(t.id==='bSign')firmar();
  if(t.id==='bCmt'){const n=(+cur.c_n||0)+1;Object.assign(cur,readForm());cur.c_n=n;renderCmts(n);fillForm(cur);onInput()}
  if(t.dataset.delf!=null&&await dialog('<p>¿Quitar esta foto?</p>','Quitar')){cur.fotos.splice(+t.dataset.delf,1);renderFotos();touch();dbPut(cur)}
});
form.addEventListener('change',async e=>{
  if(e.target.id!=='fFoto')return;
  const files=[...e.target.files];toast('Procesando '+files.length+' foto(s)…');
  for(const f of files){try{cur.fotos.push({data:await shrink(f),cap:''})}catch(_){toast('No se pudo leer una imagen')}}
  e.target.value='';renderFotos();touch();dbPut(cur);
});
$('#bNew').onclick=newFicha;
$('#bBack').onclick=async()=>{Object.assign(cur,readForm());await dbPut(cur);show('list');renderList()};
$('#bCheck').onclick=()=>{const m=missing(readFormSafe());dialog(m.length?`<p><b>${m.length} pendientes:</b></p><ul>${m.map(x=>`<li>${H(x)}</li>`).join('')}</ul>`:'<p>La ficha está completa.</p>')};
function readFormSafe(){Object.assign(cur,readForm());return cur}
$('#bPrint').onclick=async()=>{const d=readFormSafe();await dbPut(d);const m=missing(d);if(m.length&&!await dialog(`<p>Hay ${m.length} campos pendientes. ¿Generar el PDF de todas formas?</p>`,'Generar PDF'))return;imprimir([d])};
$('#list').addEventListener('click',async e=>{
  const t=e.target, all=await dbAll(), d=all.find(x=>x.id===(t.dataset.ed||t.dataset.pr||t.dataset.del));if(!d)return;
  if(t.dataset.ed)openFicha(d);
  if(t.dataset.pr)imprimir([d]);
  if(t.dataset.del){const exp=d.exportedAt&&d.updated<=d.exportedAt;if(await dialog(`<p>¿Borrar la ficha ${H(d.formNo)} de este celular?</p>${exp?'':'<p><b>Esta ficha no ha sido exportada.</b> Se perderá definitivamente.</p>'}`,'Borrar')){await dbDel(d.id);renderList()}}
});
$('#bExp').onclick=exportar;
$('#bPrintAll').onclick=async()=>{const all=(await dbAll()).sort((a,b)=>a.created-b.created);if(!all.length)return toast('No hay fichas');imprimir(all)};
$('#fImp').onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);e.target.value=''};
$('#bClean').onclick=async()=>{const all=await dbAll();const ok=all.filter(d=>d.exportedAt&&d.updated<=d.exportedAt);if(await dialog(`<p>Se borrarán ${ok.length} fichas ya exportadas. Confirme que ya subió los archivos a Drive.</p>`,'Ya subí, borrar')){for(const d of ok)await dbDel(d.id);renderList()}};
$('#bCfg').onclick=async()=>{
  const html=`<h3 style="margin-top:0">Datos del inspector</h3>${fld('Nombre completo (líder de la comisión)',`<input id="cfN" type="text" value="${H(ls.get('nombre',''))}">`)}${fld('Prefijo de numeración (una letra distinta por inspector)',`<input id="cfP" type="text" maxlength="3" value="${H(ls.get('prefijo','A'))}">`)}${fld('Código de la comisión',`<input id="cfC" type="text" value="${H(ls.get('comision',''))}">`)}
  <h3>Firma</h3><p class="hint">Firme con el dedo en el recuadro o suba una foto de su firma en papel blanco.</p>
  <canvas id="cfSig" width="900" height="300"></canvas>
  <div class="row" style="margin-top:6px"><button type="button" class="btn" id="cfClr">Borrar firma</button><label class="btn" for="cfUp">Subir imagen</label><input type="file" id="cfUp" accept="image/*" class="hidden"></div>`;
  const pend=dialog(html,'Guardar');sigPad(ls.get('firma',''));
  if(await pend){ls.set('nombre',$('#cfN').value.trim());if(sigDirty)ls.set('firma',sigData());ls.set('prefijo',($('#cfP').value.trim()||'A').toUpperCase());ls.set('comision',$('#cfC').value.trim());renderList()}
};

let sigDirty=false,sigInk=false;
function sigPad(init){
  const c=$('#cfSig'),x=c.getContext('2d');sigDirty=false;sigInk=!!init;
  const clear=()=>{x.clearRect(0,0,c.width,c.height)};
  const put=src=>{const im=new Image();im.onload=()=>{clear();const k=Math.min(c.width/im.width,c.height/im.height);const w=im.width*k,h=im.height*k;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)};im.src=src};
  if(init)put(init);
  x.lineWidth=5;x.lineCap=x.lineJoin='round';x.strokeStyle='#0a2a6b';
  let on=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);on=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);sigDirty=sigInk=true};
  c.onpointermove=e=>{if(!on)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{on=false};
  $('#cfClr').onclick=()=>{clear();sigDirty=true;sigInk=false};
  $('#cfUp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await shrink(f);put(d);sigDirty=sigInk=true}catch(_){toast('No se pudo leer la imagen')}};
}
function sigData(){return sigInk?$('#cfSig').toDataURL('image/png'):''}
window.addEventListener('beforeunload',()=>{if(cur&&!$('#vEdit').classList.contains('hidden')){Object.assign(cur,readForm());dbPut(cur)}});

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
openDB().then(renderList).catch(()=>{$('#list').innerHTML='<p class="empty">Este navegador no permite guardar fichas. Abra la herramienta en Chrome.</p>'});
